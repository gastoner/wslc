name: build-next

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      bridge_artifact_base_url:
        description: HTTPS directory containing the pinned bridge manifest, checksums, and Windows EXEs
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned bridge files
        env:
          BRIDGE_ARTIFACT_BASE_URL: ${{ inputs.bridge_artifact_base_url }}
        run: |
          set -euo pipefail
          case "$BRIDGE_ARTIFACT_BASE_URL" in
            https://*) ;;
            *) printf '%s\n' 'Bridge artifact base URL must use HTTPS' >&2; exit 1 ;;
          esac
          mkdir -p build/bridge-artifacts
          base_url="${BRIDGE_ARTIFACT_BASE_URL%/}"
          for file in bridge-manifest.json checksums.txt wslc-bridge-windows-amd64.exe wslc-bridge-windows-arm64.exe; do
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "$base_url/$file" --output "build/bridge-artifacts/$file"
          done
      - uses: redhat-actions/buildah-build@v2
        with:
          image: extension-wslc
          tags: next ${{ github.sha }}
          containerfiles: Containerfile
          context: .
          oci: true
