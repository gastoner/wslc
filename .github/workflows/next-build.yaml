name: build-next

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      proxy_version:
        description: Published wslc-proxy release version
        required: true
        type: string
      proxy_sha256:
        description: SHA-256 of the published proxy ZIP asset
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: redhat-actions/buildah-build@v2
        with:
          image: extension-wslc
          tags: next ${{ github.sha }}
          containerfiles: build/Containerfile
          context: .
          oci: true
          build-args: |
            WSLC_PROXY_VERSION=${{ inputs.proxy_version }}
            WSLC_PROXY_SHA256=${{ inputs.proxy_sha256 }}
            WSLC_PROXY_BIN_DIR=
            WSLC_PROXY_ARCHIVE=
