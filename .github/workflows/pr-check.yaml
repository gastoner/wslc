name: pr-check

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and format
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run linter
        run: pnpm lint:check

      - name: Run formatter
        run: pnpm format:check

  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
          - os: macos-26
          - os: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Run build
        run: pnpm build

  build-oci:
    name: Build OCI image
    runs-on: ubuntu-26.04
    steps:
      - name: Build OCI
        uses: podman-desktop/gh-extensions-actions/.github/actions/oci-build@e59cd52b942e8dfcc187293c5d8e9f3831c7ac0c # v0.11.0
        with:
          ref: ${{ github.ref }}
          containerfile: Containerfile
